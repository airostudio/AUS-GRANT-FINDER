[tool.poetry]
name = "ausgrant-scraper"
version = "0.1.0"
description = "Australian Government Grant and Tender Scraper"
authors = ["AusGrant Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
httpx = "^0.27.0"
beautifulsoup4 = "^4.12.3"
lxml = "^5.1.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.1"
asyncpg = "^0.29.0"
sqlalchemy = "^2.0.27"
anthropic = "^0.18.0"
playwright = "^1.41.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
black = "^24.2.0"
ruff = "^0.2.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
